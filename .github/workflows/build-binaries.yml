name: Build and Artifact the ESP-IDF Project

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: build-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_for_esp32s3:
    name: Build binary for ESP32-S3
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # СТРАТЕГИЯ 1: Если тег тот же — мгновенно восстанавливаем готовый .bin (5 секунд)
      - name: Cache Exact Final Binary
        id: cache-binary
        uses: actions/cache@v4
        with:
          path: build/ETCU.bin
          key: binary-${{ github.ref_name }}

      # СТРАТЕГИЯ 2: Если тег новый — ускоряем компиляцию через ccache
      - name: Cache ccache compiler outputs
        if: steps.cache-binary.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          # Хэш от файлов конфигурации гарантирует: если настройки проекта сменились, кэш обновится
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/sdkconfig*', '**/main/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # Сборка проекта (запустится только для новых тегов)
      - name: esp-idf build
        if: steps.cache-binary.outputs.cache-hit != 'true'
        uses: espressif/esp-idf-ci-action@v1
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: '500M' # Ограничиваем размер кэша компилятора
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: '.'

      # Публикация артефакта в релиз
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ETCU.bin
          asset_name: etcu-esp32s3-${{ github.ref_name }}.bin
          tag: ${{ github.ref }}
          overwrite: true
