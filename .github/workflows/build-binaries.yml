name: Build and Artifact the ESP-IDF Project

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published] # Запускает сборку, если вы пересоздаете релиз на сайте

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

# Автоматически отменяет дублирующие сборки, если они запустились одновременно для одного тега
concurrency:
  group: build-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_for_esp32s3:
    name: Build binary for ESP32-S3
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # Стабильная сборка проекта с нуля (без Docker кэша)
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1 # Исправленная версия тега Docker
          target: esp32s3
          path: '.'

      # Публикация готового .bin файла в релиз GitHub
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ETCU.bin
          asset_name: etcu-esp32s3-${{ github.ref_name }}.bin
          tag: ${{ github.ref }}
          overwrite: true
